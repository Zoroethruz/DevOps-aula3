
name: CI

on:
  push:
    branches: ["main", "código"]
  pull_request:
    branches: ["main", "código"]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Executar testes
        run: pytest tests/ -v
